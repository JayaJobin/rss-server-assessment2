services:
  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://18.207.245.89:4000
    ports:
      - "3000:3000"
    depends_on:
      - api
    environment:
      - NODE_ENV=production

  api:
    build: ./api
    ports:
      - "4000:3000"
    environment:
      - NODE_ENV=production
    volumes:
      - sqlite_data:/app/sqlite

volumes:
  sqlite_data:
